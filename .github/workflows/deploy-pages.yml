name: Deploy Community Teachers (Edo & Urhobo)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    name: Regression & Multi-Language Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run all 11 storage, sync & multi-language test suites
        run: npm test

  build-and-deploy-edo:
    name: Build & Deploy Edo (edo.communityteachers.info)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Edo Application
        run: |
          npm run build
          echo "edo.communityteachers.info" > dist/CNAME
          touch dist/.nojekyll
          cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-and-publish-urhobo:
    name: Build & Publish Urhobo (urhobo.communityteachers.info)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check Urhobo Publishing Prerequisites
        id: urhobo_check
        run: |
          if [ "${{ secrets.URHOBO_DEPLOY_TOKEN }}" != "" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Notice: Urhobo publishing standby. Waiting for URHOBO_DEPLOY_TOKEN secret in CommunityTeachers."
          fi

      - name: Build Urhobo Application
        if: steps.urhobo_check.outputs.configured == 'true'
        run: |
          VITE_COMMUNITY_LANGUAGE=urhobo npm run build
          echo "urhobo.communityteachers.info" > dist/CNAME
          touch dist/.nojekyll
          cp dist/index.html dist/404.html

      - name: Publish to Urhobo Pages Repository
        if: steps.urhobo_check.outputs.configured == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.URHOBO_DEPLOY_TOKEN }}
          external_repository: ${{ vars.URHOBO_PUBLISH_REPO || 'iStoria-Ai/urhobo-community-teachers' }}
          publish_branch: gh-pages
          publish_dir: ./dist
          cname: urhobo.communityteachers.info

